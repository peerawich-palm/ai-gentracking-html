<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สมัครสมาชิก - Pawney</title>
    <style>
        :root {
            --pawney-brown: #795035;
            --pawney-blue: #4FA8D6;
            --pawney-orange: #E89B53;
            --pawney-yellow: #F7CB53;
            --bg-color: #FEF9F1;
            --card-bg: #FFFFFF;
            --text-main: #5C3D26;
            --text-muted: #9E7D65;
            --border-color: #F0E4D8;
        }
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { 
            background-color: var(--bg-color); margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 16px;
        }
        .register-card {
            background: var(--card-bg); border-radius: 20px; padding: 30px;
            width: 100%; max-width: 400px; display: flex; flex-direction: column;
            align-items: center; box-shadow: 0 4px 12px rgba(121, 80, 53, 0.08);
            border: 2px solid #FFF;
        }
        .logo-container {
            width: 80px; height: 80px; border-radius: 50%;
            background-color: var(--border-color); margin-bottom: 16px; overflow: hidden;
            border: 4px solid var(--pawney-yellow); display: flex; justify-content: center; align-items: center;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .register-card h2 { margin: 0 0 20px 0; font-size: 24px; color: var(--pawney-brown); text-align: center;}
        
        .input-group { width: 100%; margin-bottom: 14px; text-align: left; }
        .input-group label { display: block; font-size: 14px; color: var(--text-main); margin-bottom: 6px; font-weight: 600; }
        .input-group input {
            width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-color);
            font-size: 14px; color: var(--text-main); transition: 0.2s;
        }
        .input-group input:focus {
            outline: none; border-color: var(--pawney-blue);
            box-shadow: 0 0 0 3px rgba(79, 168, 214, 0.1);
        }
        
        .terms-check {
            width: 100%; display: flex; align-items: flex-start;
            font-size: 12px; color: var(--text-muted); margin-bottom: 20px; margin-top: 8px;
        }
        .terms-check input[type="checkbox"] { margin-right: 8px; margin-top: 2px; width: 16px; height: 16px; accent-color: var(--pawney-blue); }
        .terms-check a { color: var(--pawney-blue); text-decoration: none; }
        
        .btn {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            font-size: 16px; font-weight: 600; cursor: pointer; text-align: center;
            transition: 0.2s; margin-bottom: 12px;
        }
        .btn-primary { background: var(--pawney-brown); color: white; }
        .btn-primary:active { background: #5C3D26; transform: translateY(2px); }
        .btn-secondary { background: #FFF; color: var(--pawney-brown); border: 2px solid var(--border-color); }
        .btn-secondary:active { background: var(--bg-color); transform: translateY(2px); }
        
        .separator {
            width: 100%; text-align: center; margin: 12px 0; font-size: 13px; color: var(--text-muted); position: relative;
        }
        .separator:before {
            content: ""; display: block; width: 100%; height: 1px;
            background: var(--border-color); position: absolute; top: 50%; left: 0; z-index: 1;
        }
        .separator span { background-color: var(--card-bg); padding: 0 10px; position: relative; z-index: 2; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="register-card">
    <div class="logo-container">
        <img src="https://cdn.mos.cms.futurecdn.net/hzBPPxRBuPc3b3TwqNgVMa-1920-80.jpg" alt="Pawney Logo">
    </div>
    
    <h2>สร้างบัญชีใหม่</h2>
    
    <div class="input-group">
        <label>ชื่อผู้ใช้งาน (เจ้าของสัตว์เลี้ยง)</label>
        <input type="text" placeholder="ระบุชื่อของคุณ">
    </div>
    <div class="input-group">
        <label>อีเมล</label>
        <input type="email" placeholder="example@email.com">
    </div>
    <div class="input-group">
        <label>รหัสผ่าน</label>
        <input type="password" placeholder="ตั้งรหัสผ่านอย่างน้อย 8 ตัวอักษร">
    </div>
    <div class="input-group">
        <label>ยืนยันรหัสผ่าน</label>
        <input type="password" placeholder="กรอกรหัสผ่านอีกครั้ง">
    </div>

    <div class="terms-check">
        <input type="checkbox" id="terms">
        <label for="terms">ฉันยอมรับ <a href="#">เงื่อนไขการให้บริการ</a> และ <a href="#">นโยบายความเป็นส่วนตัว</a> ของ Pawney</label>
    </div>

    <button class="btn btn-primary" onclick="window.location.href='login.html'">สมัครสมาชิก</button>
    
    <div class="separator"><span>หรือ</span></div>

    <button class="btn btn-secondary" onclick="window.location.href='login.html'">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</button>
</div>

</body>
</html>
